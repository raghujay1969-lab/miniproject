{% extends "base.html" %}{% block content %}<div class="form-card wide-card"><p class="eyebrow">ALMOST THERE</p><h2>Journey & delivery details</h2><p class="muted">Enter your journey details so the catering team knows where to deliver your meal.</p><form method="post" class="stack"><div class="two-col"><label>Train number<input name="train_number" placeholder="e.g. 12627" required></label><label>PNR number<input name="pnr" placeholder="10-digit PNR (demo)" pattern="[0-9]{10}" maxlength="10" required></label><label>Coach and seat<input name="coach_seat" placeholder="e.g. B2 - 36" required></label><label>Delivery station<input name="station" placeholder="e.g. Bengaluru" required></label><label class="full">Preferred delivery time<input name="delivery_time" placeholder="e.g. 1:15 PM" required></label></div><div class="notice">Demo payment method: Cash on Delivery. No real payment will be collected.</div><button class="btn wide">Place meal order</button></form></div>{% endblock %}
